[project]
name = "behavioural-fruad-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nasria", email = "alfalahynasria@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.4",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[project.scripts]
behavioural-fruad-detection = "behavioural_fruad_detection:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
